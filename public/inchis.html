<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>40 by 40</title>
<style>
  :root { --bg: #f6f6f7; --ink: #111; --fog: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151417; --ink: #f2f2f2; --fog: #a0a0a6; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 Inter, -apple-system, system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  div { max-width: 36rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--fog); }
</style>
</head>
<body>
<main><div>
  <h1>40 by 40 e închis.</h1>
  <p>Site-ul nu mai este disponibil.</p>
</div></main>
</body>
</html>
